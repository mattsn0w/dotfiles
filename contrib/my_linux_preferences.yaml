---
editors:
  nvim:
    plugins:
      - https://github.com/nvim-lua/kickstart.nvim/
      
linux:
  distro:
    ubuntu:
      os_pkgs:
        - bat/noble
        - btop
        - chromium-browser
        - dict dictd dict-gcide dict-jargon dict-vera dict-wn dict-foldoc dict-devil
        - fd-find
        - i3
        - keepassxc
        - kitty
        - krdc
        - lolcat
        - maim
        - neovim
        - nvim
        - picom
        - polybar
        - remmina remmina-plugin-vnc
        - ripgrep
        - rofi
        - screenkey
        - stow
        - systemd-container
        - unzip
        - virt-top virt-viewer qemu-utils libvirt-daemon libqcow-utils bluetooth
        - xclip
        - xrdp
        - xxd
        - yamllint
      external_pkgs:
        urls:
          - https://get.helm.sh/helm-v3.17.2-linux-amd64.tar.gz
          - https://github.com/Julien-cpsn/ATAC/releases/download/v0.19.0/atac-v0.19.0-x86_64-unknown-linux-gnu.tar.gz
