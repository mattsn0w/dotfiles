          - https://github.com/sxyazi/yazi/releases/download/v25.5.31/yazi-x86_64-unknown-linux-musl.zip


        destination_dir: bin/downloads

    cmd_cfgs:
      sudo:
        - sudo update-alternatives --install /usr/bin/x-terminal-emulator x-terminal-emulator /bin/kitty 100
